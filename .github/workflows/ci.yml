name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP syntax (8.1–8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: find app bin database public tests -name '*.php' -print0 | xargs -0 -n1 php -l

  sqlite:
    name: SQLite demo · PHP ${{ matrix.php }} + HTTP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    env:
      APP_ENV: local
      DB_DRIVER: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_sqlite, fileinfo
          coverage: none
      - run: mkdir -p storage/sessions storage/logs public/uploads
      - run: php bin/install.php --demo
      - run: php tests/smoke.php
      - run: |
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/php-server.log 2>&1 &
          echo $! >/tmp/php-server.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: bash tests/http-smoke.sh http://127.0.0.1:8080
      - if: failure()
        run: cat /tmp/php-server.log storage/logs/php-error.log 2>/dev/null || true
      - if: always()
        run: kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true

  mysql:
    name: MySQL demo · PHP ${{ matrix.php }} + HTTP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cedar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: local
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cedar_test
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_mysql, fileinfo
          coverage: none
      - run: mkdir -p storage/sessions storage/logs public/uploads
      - run: php bin/install.php --demo
      - run: php tests/smoke.php
      - run: |
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/php-server.log 2>&1 &
          echo $! >/tmp/php-server.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: bash tests/http-smoke.sh http://127.0.0.1:8080
      - if: failure()
        run: cat /tmp/php-server.log storage/logs/php-error.log 2>/dev/null || true
      - if: always()
        run: kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true
