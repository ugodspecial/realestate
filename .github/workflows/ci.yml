name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP syntax · ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # php -l compiles each file, so version-specific parse errors and
      # compile-time deprecations surface here on every supported version.
      - run: find app bin database public tests -name '*.php' -print0 | xargs -0 -n1 php -l

  sqlite:
    name: SQLite demo · PHP ${{ matrix.php }} + HTTP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    env:
      APP_ENV: local
      DB_DRIVER: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_sqlite, fileinfo
          coverage: none
      - run: mkdir -p storage/sessions storage/logs public/uploads
      - run: php bin/install.php --demo
      - run: php tests/smoke.php
      - run: |
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/php-server.log 2>&1 &
          echo $! >/tmp/php-server.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: bash tests/http-smoke.sh http://127.0.0.1:8080
      - name: Fail on PHP deprecations/warnings
        run: '! grep -iE "deprecat|PHP (Warning|Fatal|Notice)|Uncaught" /tmp/php-server.log storage/logs/php-error.log'
      - if: failure()
        run: cat /tmp/php-server.log storage/logs/php-error.log 2>/dev/null || true
      - if: always()
        run: kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true

  mysql:
    name: MySQL demo · PHP ${{ matrix.php }} + HTTP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cedar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: local
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cedar_test
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo_mysql, fileinfo
          coverage: none
      - run: mkdir -p storage/sessions storage/logs public/uploads
      - run: php bin/install.php --demo
      - run: php tests/smoke.php
      - run: |
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/php-server.log 2>&1 &
          echo $! >/tmp/php-server.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: bash tests/http-smoke.sh http://127.0.0.1:8080
      - name: Fail on PHP deprecations/warnings
        run: '! grep -iE "deprecat|PHP (Warning|Fatal|Notice)|Uncaught" /tmp/php-server.log storage/logs/php-error.log'
      - if: failure()
        run: cat /tmp/php-server.log storage/logs/php-error.log 2>/dev/null || true
      - if: always()
        run: kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true

  upgrade:
    name: Upgrade path · migrations + backup
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cedar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, pdo_mysql, fileinfo
          coverage: none
      - run: mkdir -p storage/sessions storage/logs public/uploads
      # Runner logic on scratch databases (ordering, tracking, idempotency,
      # tamper warnings, failure isolation, legacy adoption).
      - run: php tests/migrations.php
      # SQLite leg: install runs through the migrator, then the upgrade path
      # is exercised with a real backup plus legacy-table simulation.
      - run: |
          php bin/install.php --demo
          php bin/upgrade.php --dry-run
          php bin/upgrade.php
          test -n "$(ls storage/backups/db-*.sqlite 2>/dev/null)"
          php -r 'require "app/bootstrap.php"; Database::connection()->exec("DROP TABLE migrations");'
          php bin/upgrade.php
          php tests/smoke.php
        env:
          DB_DRIVER: sqlite
      # MySQL leg: same flow without a dump (no mysqldump on runners).
      - run: |
          php bin/install.php --demo
          php bin/upgrade.php --dry-run
          php bin/upgrade.php --no-backup
          php -r 'require "app/bootstrap.php"; Database::connection()->exec("DROP TABLE migrations");'
          php bin/upgrade.php --no-backup
          php tests/smoke.php
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: cedar_test
          DB_USER: root
          DB_PASS: root

  # Forward-compatibility watch: tracks upcoming PHP on a best-effort basis.
  # Non-blocking (continue-on-error) — it reports future breakage early without
  # ever failing the build. When a new PHP version goes stable, promote it into
  # the matrices above and keep this job on nightly.
  future:
    name: Forward-compat watch · nightly (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      APP_ENV: local
      DB_DRIVER: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: nightly
          extensions: gd, mbstring, pdo_sqlite, fileinfo
          coverage: none
      - run: mkdir -p storage/sessions storage/logs public/uploads
      - run: php bin/install.php --demo
      - run: php tests/smoke.php
      - run: |
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/php-server.log 2>&1 &
          echo $! >/tmp/php-server.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
      - run: bash tests/http-smoke.sh http://127.0.0.1:8080
      - name: Report PHP deprecations/warnings
        run: '! grep -iE "deprecat|PHP (Warning|Fatal|Notice)|Uncaught" /tmp/php-server.log storage/logs/php-error.log'
      - if: failure()
        run: cat /tmp/php-server.log storage/logs/php-error.log 2>/dev/null || true
      - if: always()
        run: kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true
